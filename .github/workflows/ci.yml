name: Build and isolated tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use HTTPS for the public SGDM git dependency
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install frontend dependencies
        run: npm ci --include=optional
      - name: Build frontend
        run: npm run build
      - name: Audit official SGDM design contract
        run: npm run audit:design
      - name: Test streamed event handling
        run: npm test

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies including PDF native binaries
        run: npm ci --include=optional
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Build backend
        run: npm run build
      - name: Run isolated tests without external services
        run: npm test
